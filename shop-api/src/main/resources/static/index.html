<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Agent</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--muted:#6b7280;--accent:#2563eb;--border:#e2e5ea;--user:#e8f0fe;--code:#f1f3f6}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--text:#e6e9ef;--muted:#9aa3b2;--accent:#6ea0ff;--border:#2b3240;--user:#22314f;--code:#252b37}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;height:100vh}
header{padding:12px 20px;border-bottom:1px solid var(--border);background:var(--card)}
header h1{margin:0;font-size:17px}header small{color:var(--muted)}
#log{flex:1;overflow-y:auto;padding:20px;max-width:820px;width:100%;margin:0 auto}
.msg{margin:0 0 16px;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card)}
.msg.user{background:var(--user);margin-left:15%}
.msg.err{border-color:#d33;color:#d33}
.msg p{margin:0 0 8px}.msg p:last-child{margin:0}.msg ul{margin:4px 0 8px;padding-left:22px}
code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:13px}
details{margin-top:10px;font-size:13px;color:var(--muted)}summary{cursor:pointer}
.call{margin:8px 0;padding:8px;background:var(--code);border-radius:6px}
.call b{color:var(--accent)}.call pre{margin:4px 0 0;white-space:pre-wrap;word-break:break-word;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chips button{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:16px;padding:6px 12px;cursor:pointer;font-size:13px}
.chips button:hover{border-color:var(--accent)}
form{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--border);background:var(--card)}
.bar{max-width:780px;width:100%;margin:0 auto;display:flex;gap:8px}
input[type=text]{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
button.send{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:0 18px;font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
#tokrow{display:none;padding:8px 20px;background:var(--card);border-top:1px solid var(--border);font-size:13px}
#tokrow input{padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
</style>
</head>
<body>
<header><h1>Shop Agent <small>&middot; each question is independent (no chat memory yet)</small></h1></header>
<div id="log">
  <div class="chips" id="chips"></div>
</div>
<div id="tokrow">Token required: <input id="tok" type="password" placeholder="X-Agent-Token"> <small>saved in this browser</small></div>
<form id="f"><div class="bar">
  <input type="text" id="q" maxlength="1000" placeholder="Ask about sales or inventory..." autocomplete="off" autofocus>
  <button class="send" id="go">Send</button>
</div></form>
<script>
const log=document.getElementById('log'),q=document.getElementById('q'),go=document.getElementById('go');
const tok=document.getElementById('tok');tok.value=localStorage.getItem('agentToken')||'';
tok.addEventListener('input',()=>localStorage.setItem('agentToken',tok.value));
if(tok.value)document.getElementById('tokrow').style.display='block';

['Which products are out of stock?','Which of the top 10 products by revenue are low on stock?',
 'Which region had the highest revenue in 2024?','How many Electronics products are below their reorder level?']
 .forEach(t=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.onclick=()=>{q.value=t;ask()};chips.appendChild(b)});

const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');
function md(src){let out='',list=false;
  for(const l of esc(src).split('\n')){const m=l.match(/^\s*[*-]\s+(.*)/);
    if(m){if(!list){out+='<ul>';list=true}out+='<li>'+inl(m[1])+'</li>'}
    else{if(list){out+='</ul>';list=false}if(l.trim())out+='<p>'+inl(l)+'</p>'}}
  return out+(list?'</ul>':'')}

function add(cls,html){const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}

function trace(r){const calls=r.toolCalls||[];
  const d=document.createElement('details');const s=document.createElement('summary');
  s.textContent=`${calls.length} tool call${calls.length==1?'':'s'} \u00b7 ${r.steps} steps \u00b7 ${(r.totalTokens||0).toLocaleString()} tokens`;
  d.appendChild(s);
  calls.forEach(c=>{const div=document.createElement('div');div.className='call';
    const b=document.createElement('b');b.textContent=c.tool;div.appendChild(b);
    let a=c.arguments;try{a=JSON.stringify(JSON.parse(a))}catch(e){}
    const p1=document.createElement('pre');p1.textContent='args: '+a;div.appendChild(p1);
    const p2=document.createElement('pre');p2.textContent='result: '+c.resultPreview;div.appendChild(p2);
    d.appendChild(div)});
  return d}

const ERR={401:'Missing or wrong token. Enter the AGENT_TOKEN below.',400:'Question must be 1-1000 characters.',
 503:'The server has no OPENAI_API_KEY configured.',502:'The model provider returned an error (quota, rate limit or bad model name). Check the container logs.'};

async function ask(){
  const text=q.value.trim();if(!text)return;
  q.value='';go.disabled=q.disabled=true;
  add('user',esc(text));
  const wait=add('', '<i>Thinking...</i>');
  try{
    const h={'Content-Type':'application/json'};if(tok.value)h['X-Agent-Token']=tok.value;
    const res=await fetch('/api/agent/chat',{method:'POST',headers:h,body:JSON.stringify({question:text})});
    if(!res.ok){if(res.status===401)document.getElementById('tokrow').style.display='block';
      wait.className='msg err';wait.textContent=ERR[res.status]||('Error '+res.status);return}
    const r=await res.json();
    wait.innerHTML=md(r.answer||'(empty answer)');wait.appendChild(trace(r));
  }catch(e){wait.className='msg err';wait.textContent='Could not reach the server.'}
  finally{go.disabled=q.disabled=false;q.focus();log.scrollTop=log.scrollHeight}
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();ask()});
</script>
</body>
</html>
