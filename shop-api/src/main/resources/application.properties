server.port=8080

# SQLite (WAL = concurrent readers while one writer writes)
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:${DB_PATH:./data/shop.db}?journal_mode=WAL&synchronous=NORMAL&busy_timeout=10000&foreign_keys=true
spring.datasource.hikari.maximum-pool-size=4

# Creates tables on startup (CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always

# Demo data volume (override with env vars APP_SEED_PRODUCTS / APP_SEED_SALES)
app.seed.products=1000
app.seed.sales=2000000

management.endpoints.web.exposure.include=health

# ---- Agent (OpenAI) ----
agent.openai.api-key=${OPENAI_API_KEY:}
agent.openai.model=${OPENAI_MODEL:gpt-5.4-nano}
agent.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
agent.max-steps=6
# Optional: if set, callers must send header X-Agent-Token
agent.token=${AGENT_TOKEN:}
